name: daily
on:
  schedule:
    # 평일(월~금) 06:40 한국시간에 시작. GitHub 예약은 늦게 시작할 때가 많아서 일찍 돌리고,
    # 알림은 아래 push 단계에서 정확히 08:00까지 기다렸다가 보낸다. (UTC 일~목 21:40 = 한국 월~금 06:40)
    - cron: '40 21 * * 0-4'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'scripts/**', 'config/**', '.github/workflows/daily.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: 세대 정보 (비밀값 → 파일, 로그에 안 나옴)
        env: { HOUSEHOLD_JSON: '${{ secrets.HOUSEHOLD_JSON }}' }
        run: if [ -n "$HOUSEHOLD_JSON" ]; then printf '%s' "$HOUSEHOLD_JSON" > config/household.json; fi
      - name: 수집·분석
        run: node src/run.mjs
      - name: 웹앱 빌드·암호화
        run: node scripts/build.mjs && node scripts/encrypt.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }
      - name: 푸시용 요약 보관
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            dist/summary.json
            dist/push-users.enc
          retention-days: 1
          if-no-files-found: ignore
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  push:
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: summary, path: dist }
      - name: 08:00(한국시간)까지 대기
        if: github.event_name == 'schedule'
        run: |
          now=$(date -u +%s)
          target=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 08:00:00" +%s)
          wait=$((target - now))
          echo "지금 $(TZ=Asia/Seoul date +%T), ${wait}초 대기"
          if [ $wait -gt 0 ]; then sleep $wait; fi
      - name: 아이폰 푸시
        env:
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          VAPID_PUBLIC_KEY: BDGbFHT5-WKQMTzp1Y_tj_5ByKKSqmjqoVrW-P67Yf2_EUMiaAS6Xabst53usz-kz1tCr6UA8OA_vk-gl47xPCA
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/push.mjs
