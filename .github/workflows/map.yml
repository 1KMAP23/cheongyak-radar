name: map
on: workflow_dispatch
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: cd scripts/map && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: cd scripts/map && (python3 -m http.server 8080 &) && sleep 2 && node render.mjs
      - uses: actions/upload-artifact@v4
        with: { name: map, path: scripts/map/wangsuk-map.png }
