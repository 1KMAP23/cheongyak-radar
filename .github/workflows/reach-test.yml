name: reach-test
on:
  push:
    paths: ['.github/workflows/reach-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.DATA_GO_KR_KEY }}
      KK: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - name: 키를 넣고 각 API 실제 응답 확인 (해외 서버)
        run: |
          echo "runner IP: $(curl -s https://api.ipify.org)"
          echo "key set: ${K:+yes} / kakao set: ${KK:+yes}"
          t() { code=$(curl -s -o /tmp/b -m 30 -w "%{http_code}" "$@" || echo FAIL); echo "== $code"; head -c 400 /tmp/b | tr '\n' ' '; echo; echo; }
          echo "[청약홈]"; t "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail?page=1&perPage=1&serviceKey=$K"
          echo "[LH 공고]"; t "https://apis.data.go.kr/B552555/lhLeaseNoticeInfo1/lhLeaseNoticeInfo1?PG_SZ=2&PAGE=1&UPP_AIS_TP_CD=05&serviceKey=$K"
          echo "[실거래가]"; t "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?LAWD_CD=41117&DEAL_YMD=202610&numOfRows=1&pageNo=1&serviceKey=$K"
          echo "[분양권]"; t "https://apis.data.go.kr/1613000/RTMSDataSvcSilvTrade/getRTMSDataSvcSilvTrade?LAWD_CD=41117&DEAL_YMD=202610&numOfRows=1&pageNo=1&serviceKey=$K"
          echo "[카카오 로컬]"; t -H "Authorization: KakaoAK $KK" "https://dapi.kakao.com/v2/local/search/keyword.json?query=%EC%98%A4%EB%A5%9C%EA%B5%90%ED%9A%8C&size=1"
          echo "[카카오 미래 길찾기]"; t -H "Authorization: KakaoAK $KK" "https://apis-navi.kakaomobility.com/v1/future/directions?origin=127.053213432207,37.2734624286596&destination=127.132395701923,37.522741716368&departure_time=202611160800"
