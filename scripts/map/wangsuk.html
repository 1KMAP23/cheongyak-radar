<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}
#map{width:1100px;height:1300px}
.lb{background:#fff;border:2px solid var(--c);border-radius:8px;padding:3px 7px;font-size:15px;font-weight:700;color:#111;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.25}
.lb small{display:block;font-weight:500;font-size:12px;color:#444}
.leaflet-tooltip.lb:before{display:none}
.st{background:#222;color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:13px;font-weight:700}
.leaflet-tooltip.st:before{display:none}
.zone{font-size:30px;font-weight:900;color:#5b3a99;text-shadow:0 0 4px #fff,0 0 8px #fff;white-space:nowrap}
.legend{position:absolute;left:14px;top:14px;z-index:999;background:#fff;border-radius:10px;padding:12px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);line-height:1.7}
.legend h1{font-size:19px;margin:0 0 4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.legend p{margin:6px 0 0;font-size:12px;color:#555;max-width:330px}
</style></head><body>
<div id="map"></div>
<div class="legend"><h1>남양주 왕숙 신도시 청약 현황</h1>
<div><i style="background:#1d5fd1"></i>분양 끝난 공공분양 (단지명)</div>
<div><i style="background:#1e9c5a"></i>분양 끝난 신혼희망타운</div>
<div><i style="background:#e0362c"></i>지금 청약 중 (11/30~12/2)</div>
<div><i style="background:#8a8f98"></i>사전청약만 끝난 블록 (본청약 예정)</div>
<div><i style="background:#222;border-radius:3px"></i>지하철·전철역</div>
<p>청약홈 공고 기준 2026-11-20. 괄호는 블록 · 세대수 · 입주 예정. 그 밖의 블록은 아직 공고가 없어 위치 미표시(토지이용계획도 참고). 왕숙역(GTX-B·9호선 연장)은 위치 미확정이라 표시하지 않음.</p></div>
<script>
const m = L.map('map', { zoomControl: false, attributionControl: true }).setView([37.652, 127.172], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19 }).addTo(m);
const C = { pub: '#1d5fd1', hope: '#1e9c5a', now: '#e0362c', pre: '#8a8f98' };
const P = [
  ['pub', '왕숙 푸르지오 더 퍼스트 1단지', 'B-1 · 560 · 2028.05', 37.68786, 127.17276, 'right'],
  ['pub', '왕숙 푸르지오 더 퍼스트 2단지', 'B-2 · 587 · 2028.06', 37.68432, 127.17167, 'right'],
  ['pub', '남양주왕숙 A-1 공공분양', 'A-1 · 629 · 2028.08', 37.69127, 127.17033, 'left'],
  ['hope', '남양주왕숙 A-2 신혼희망타운', 'A-2 · 401 · 2028.08', 37.68879, 127.16902, 'left'],
  ['pub', '남양주왕숙 B-17 공공분양', 'B-17 · 491 · 2028.12', 37.65654, 127.17104, 'right'],
  ['hope', '남양주왕숙 A-24 신혼희망타운', 'A-24 · 390 · 2028.12', 37.65630, 127.16924, 'bottom'],
  ['now', '왕숙 한신더휴 센텀', 'A-17 · 379 · 2029.07', 37.65841, 127.16629, 'left'],
  ['pub', '왕숙 아테라', '왕숙2 A-1 · 812 · 2029.02', 37.61954, 127.17181, 'left'],
  ['pub', '남양주왕숙2 A-3 공공분양', '왕숙2 A-3 · 686 · 2030.05', 37.61890, 127.17783, 'bottom'],
  ['pre', '왕숙2 A-4 블록', '사전청약 완료 · 본청약 예정', 37.62040, 127.17865, 'top'],
  ['pre', '왕숙2 A-6 블록', '사전청약 완료 · 본청약 예정', 37.61793, 127.18570, 'right'],
];
for (const [k, n, sub, y, x, dir] of P) {
  L.circleMarker([y, x], { radius: 9, color: '#fff', weight: 3, fillColor: C[k], fillOpacity: 1 }).addTo(m)
   .bindTooltip(`${n}<small>${sub}</small>`, { permanent: true, direction: dir, offset: dir === 'left' ? [-10, 0] : dir === 'right' ? [10, 0] : dir === 'top' ? [0, -10] : [0, 10], className: 'lb' }).openTooltip();
}
document.querySelectorAll('.lb').forEach((el, i) => el.style.setProperty('--c', C[P[i][0]]));
const S = [['사릉역 (경춘선)', 37.65112, 127.17693], ['퇴계원역 (경춘선)', 37.64827, 127.14354], ['별내역 (8호선·경춘선)', 37.64207, 127.12697], ['다산역 (8호선)', 37.62428, 127.14980], ['도농역 (경의중앙선)', 37.60877, 127.16118], ['양정역 (경의중앙선)', 37.60403, 127.19467], ['금곡역 (경춘선)', 37.63736, 127.20753], ['오남역 (4호선)', 37.70516, 127.19110]];
for (const [n, y, x] of S) L.marker([y, x], { icon: L.divIcon({ className: '', html: '<div style="width:12px;height:12px;background:#222;border:2px solid #fff;border-radius:3px"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(m).bindTooltip(n, { permanent: true, direction: 'bottom', offset: [0, 6], className: 'st' });
for (const [n, y, x] of [['왕숙1 (남양주왕숙)', 37.675, 127.150], ['왕숙2', 37.6125, 127.19]]) L.marker([y, x], { icon: L.divIcon({ className: '', html: `<div class="zone">${n}</div>`, iconSize: [0, 0] }) }).addTo(m);
m.fitBounds([[37.598, 127.125], [37.708, 127.21]], { padding: [10, 10] });
window.READY = new Promise(r => setTimeout(r, 4000));
</script></body></html>
